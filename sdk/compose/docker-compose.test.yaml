# SDK-only test stack: no parent configuration, shared networks or volumes.
name: fastrag-sdk-tests
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fastrag_sdk_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
    - 127.0.0.1:55433:5432
    volumes:
    - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d fastrag_sdk_test]
      interval: 3s
      timeout: 3s
      retries: 30
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd --advertise-client-urls=http://etcd:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
    - etcd:/etcd
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: ${SDK_TEST_STORAGE_USER:?Run scripts/test_services.py start}
      MINIO_ROOT_PASSWORD: ${SDK_TEST_STORAGE_PASSWORD:?Run scripts/test_services.py start}
    volumes:
    - minio:/minio_data
  milvus:
    image: milvusdb/milvus:v2.6.2
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${SDK_TEST_STORAGE_USER:?Run scripts/test_services.py start}
      MINIO_SECRET_ACCESS_KEY: ${SDK_TEST_STORAGE_PASSWORD:?Run scripts/test_services.py start}
    ports:
    - 127.0.0.1:19531:19530
    volumes:
    - milvus:/var/lib/milvus
    depends_on:
    - etcd
    - minio
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
volumes:
  postgres:
  etcd:
  minio:
  milvus:
